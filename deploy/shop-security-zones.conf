# Shared-memory limits for the public Shop.  Empty login keys are not
# accounted, so ordinary GET requests to the login page remain unaffected.
map "$request_method:$uri" $shop_login_limit_key {
    default "";
    ~^POST:/(en/)?web/login$ $binary_remote_addr;
}

limit_req_zone $shop_login_limit_key zone=shop_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=shop_checkout:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=shop_callback:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=shop_per_ip:10m;
server_tokens off;
